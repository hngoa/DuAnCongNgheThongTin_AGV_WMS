; PlatformIO Project Configuration File for AGV_Ver2
; Hỗ trợ mô hình kiểm thử phân tách từng bước trong thư mục test/
; Chọn môi trường tương ứng tại thanh trạng thái phía dưới của VS Code  

[platformio]
default_envs = test_10_line_centric_hybrid_recovery

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0

; ====================================================================
; BƯỚC 0: KIỂM THỬ ĐIỀU KHIỂN ĐỘNG CƠ CĂN BẢN (TIẾN, LÙI, RẼ, TỰ DỪNG)
; ====================================================================
[env:test_00_basic_motor_control]
build_src_filter = -<*> +<../test/test_00_basic_motor_control.cpp>

; ====================================================================
; BƯỚC 1.1: HIỆU CHỈNH CẢM BIẾN DÒ LINE TCRT5000 (5 MẮT)
; ====================================================================
[env:test_01_ir_calibration]
build_src_filter = -<*> +<../test/test_01_ir_calibration.cpp>

; ====================================================================
; BƯỚC 1.2: ĐIỀU KHIỂN AGV BÁM LINE BẰNG THUẬT TOÁN PD CẢI TIẾN
; ====================================================================
[env:test_02_line_follow_pid]
build_src_filter = -<*> +<../test/test_02_line_follow_pid.cpp>

; ====================================================================
; BƯỚC 2: KIỂM THỬ BỘ ĐẾM ENCODER HALL & QUÃNG ĐƯỜNG
; ====================================================================
[env:test_03_encoder_motor_balance]
build_src_filter = -<*> +<../test/test_03_encoder_motor_balance.cpp>

; ====================================================================
; BƯỚC 3: KIỂM THỬ IMU MPU-6050 XÁC ĐỊNH GÓC HƯỚNG & HEADING HOLD
; ====================================================================
[env:test_04_mpu6050_heading_hold]
build_src_filter = -<*> +<../test/test_04_mpu6050_heading_hold.cpp>

; ====================================================================
; BƯỚC 4: TÍCH HỢP ODOMETRY (ENCODER + MPU) & WEB TELEMETRY DASHBOARD
; ====================================================================
[env:test_05_web_telemetry_odometry]
build_src_filter = -<*> +<../test/test_05_web_telemetry_odometry.cpp>

; ====================================================================
; BƯỚC 5: KIỂM THỬ & HIỆU CHUẨN ENCODER 1 MÉT (ZERO-SLIP CHUYÊN DỤNG)
; ====================================================================
[env:test_06_encoder_1m_calibration]
build_src_filter = -<*> +<../test/test_06_encoder_1m_calibration.cpp>

; ====================================================================
; BƯỚC 7: KIỂM THỬ CẢM BIẾN DÒNG/ÁP INA226 (I2C GPIO 8 & GPIO 9)
; ====================================================================
[env:test_07_ina226_current_sensor]
build_src_filter = -<*> +<../test/test_07_ina226_current_sensor.cpp>

; ====================================================================
; BƯỚC 8: BÁM LINE ROBUST & VƯỢT VẠCH ĐỨT ĐOẠN / MỜ / NHIỄU SÁNG
; ====================================================================
[env:test_08_gap_crossing_robust_line]
build_src_filter = -<*> +<../test/test_08_gap_crossing_robust_line.cpp>

; ====================================================================
; BƯỚC 9: ĐIỀU HƯỚNG ĐỒ THỊ 2 CHIỀU & ĐIỂM - ĐIỂM LINH HOẠT (BIDIRECTIONAL)
; ====================================================================
[env:test_09_bidirectional_flexible_routing]
build_src_filter = -<*> +<../test/test_09_bidirectional_flexible_routing.cpp>

; ====================================================================
; BƯỚC 10: BÁM LINE TỰ DO (CONG/ZIGZAG) & CỨU HỘ MẤT LINE THÔNG MINH
; ====================================================================
[env:test_10_line_centric_hybrid_recovery]
build_src_filter = -<*> +<../test/test_10_line_centric_hybrid_recovery.cpp>

; ====================================================================
; MÔI TRƯỜNG TÍCH HỢP HỆ THỐNG AGV_VER2 CHÍNH (SRC/MAIN.CPP)
; ====================================================================
[env:agv_ver2_main]
build_src_filter = +<main.cpp>
